name: {{ cookiecutter.project_slug }}
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.11,<3.15
  - pywps >=4.6.0
  - jinja2 >=3.1.4
  - click >=8.1.7
  - psutil >=6.0.0
  # development
{%- if cookiecutter.use_black == 'y' %}
  - black ==25.1.0
{%- endif %}
  - bump-my-version >=1.3.0
  - coverage >=7.5.0
  - cruft >=2.17.0
  - flit >=3.12.0,<4.0
  - ipython >=8.5.0
{%- if cookiecutter.use_black == 'y' %}
  - isort ==6.0.0
{%- endif %}
  - nbsphinx >=0.9.5
  - nbval >=0.10.0
{%- if cookiecutter.use_pytest == 'y' %}
  - pytest >=8.0.0
  - pytest-cov >=5.0.0
{%- endif %}
  - ruff >=0.15.0
  - sphinx >=7.1.0
  - tox >=4.52.0
  - watchdog >=6.0.0
