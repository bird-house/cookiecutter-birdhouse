name: Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - src/{{ cookiecutter.project_slug }}/__version__.py
    tags:
      - "v*"
  pull_request:

{% raw -%}
concurrency:
  # For a given workflow, if we push to the same branch, cancel all previous builds on that branch except on master.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
{%- endraw %}

permissions:
  contents: read


jobs:
  build-publish:
    name: Test and Publish image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: {{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}
    {% raw -%}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gather Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=test,enable={{is_not_default_branch}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image and publish to Docker Hub
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Inspect labels
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker inspect --format='{{json .Config.Labels}}' ${{ env.IMAGE_NAME }}:test

      - name: Run Docker image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test sh -c '
            {{ cookiecutter.project_slug }} start -d
            sleep 2s
            {{ cookiecutter.project_slug }} status
            {{ cookiecutter.project_slug }} stop
          '
    {%- endraw %}
