name: Docker-based Testing Suite

on:
  push:
    branches:
      - main
  pull_request:

{% raw -%}
concurrency:
  # For a given workflow, if we push to the same branch, cancel all previous builds on that branch except on master.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
{%- endraw %}

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Docker image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: {{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gather Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: {% raw -%} ${{ env.IMAGE_NAME }} {%- endraw %}
          tags: |
            type=raw,value=test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile
          labels: {% raw -%} ${{ steps.meta.outputs.labels } {%- endraw %}
          load: true
          push: false
          tags: {% raw -%} ${{ steps.meta.outputs.tags }} {%- endraw %}

      - name: Run Docker image
        run: |
          docker run --rm {% raw -%} ${{ env.IMAGE_NAME }} {%- endraw %}:test sh -c '
            {{ cookiecutter.project_slug }} start -d
            sleep 2s
            {{ cookiecutter.project_slug }} status
            {{ cookiecutter.project_slug }} stop
          '
