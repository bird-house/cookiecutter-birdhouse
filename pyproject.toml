[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
docs = [
  "alabaster >=1.0.0",
  "sphinx >=8.0.0"
]
test = [
  "coverage >=7.13.0",
  "pywps >=4.6.0",
  "pytest >=9.0.2",
  "pytest-cookies >=0.7.0"
]
tox = [
  "tox >=4.52.0",
  "tox-gh >=1.7.1"
]
dev = [
  "build >=1.4.2",
  "cookiecutter >=2.7.0",
  "cruft >=2.15.0",
  "flit >=3.12.0,<4.0",
  "prek >=0.4.0",
  "pyyaml >=6.0.2",
  "ruff >=0.15.0",
  "twine >=6.2.0",
  "watchdog >=6.0.0",
  {include-group = "docs"},
  {include-group = "test"},
  {include-group = "tox"}
]

[project]
name = "cookiecutter-birdhouse"
dynamic = ["version"]
description = "Cookiecutter template for a PyWPS service"
readme = "README.rst"
authors = [
  {name = "Carsten Ehbrecht", email = "ehbrecht@dkrz.de"},
  {name = "Trevor James Smith", email = "smith.trevorj@ouranos.ca"}
]
maintainers = [
  {name = "Carsten Ehbrecht", email = "ehbrecht@dkrz.de"},
  {name = "Trevor James Smith", email = "smith.trevorj@ouranos.ca"}
]
license = {file = "LICENSE"}
keywords = ["cookiecutter", "template", "package", "wps", "pywps", "birdhouse"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development"
]
dependencies = [
  "cookiecutter >=2.7.0"
]

[project.urls]
Source = "https://github.com/bird-house/cookiecutter-birdhouse"
Documentation = "https://cookiecutter-birdhouse.readthedocs.io/en/latest/"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest]
addopts = [
  "--strict",
  "--tb=native",
  "--verbose"
]
markers = [
  "online: mark test to need internet connection",
  "precommit: mark test as needing pre-commit",
  "requires_gdal: mark test as needing GDAL",
  "slow: mark test to be slow"
]
testpaths = ["tests"]

[tool.ruff]
exclude = [
  "*cookiecutter.project_slug*"
]

[tool.setuptools.packages.find]
include = [""]

[tool.setuptools_scm]

[tool.tox]
env_list = [
  {product = [{prefix = "py3.", start = 11, stop = 14}]},
  "pypy3.11",
  "docs"
]
skip_missing_interpreters = true

[tool.tox.env.docs]
changedir = "docs/source"
dependency_groups = ["docs"]
commands = [
  ["sphinx-build", "-b", "html", "-d", "{envtmpdir}/doctrees", ".", "{envtmpdir}/html"]
]

[tool.tox.env."pypy3.11"]
set_env.PYTEST_ADDOPTS = {replace = "env", name = "PYTEST_ADDOPTS", default = "--color=yes --mark 'not requires_gdal'"}

[tool.tox.env_run_base]
set_env = {PYTEST_ADDOPTS = "--color=yes", PYTHONPATH = "{toxinidir}", TOX = "1"}
dependency_groups = ["dev"]
download = true
commands_pre = [
  ["pip", "list"],
  ["-", "pip", "check"]
]
commands = [["pytest", "{toxinidir}/tests/test_bake_project.py"]]

[tool.tox.gh.python]
"3.11" = ["py3.11"]
"3.12" = ["py3.12"]
"3.13" = ["py3.13"]
"3.14" = ["py3.14"]
"pypy3.11" = ["pypy3.11"]
